name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DSH_REPOSITORY: deepseek-ai/deepseek-harness
  DSH_REF: dsh-v0.1.2-alpha.1

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24', '26']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - if: matrix.node == '24'
        run: pnpm pack --pack-destination .artifacts

  harness:
    name: DSH 0.1.2-alpha.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.DSH_REPOSITORY }}
          ref: ${{ env.DSH_REF }}
          path: harness
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            harness/pnpm-lock.yaml

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Harness dependencies
        run: pnpm --dir harness install --frozen-lockfile

      - name: Test against the real Harness UI stack
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/harness
        run: pnpm test:harness

      - name: Pack the plugin
        run: pnpm pack --pack-destination .artifacts

      - name: Install and remove the packed profile layer
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-session-graph-home
        run: |
          plugin_version=$(node -p 'require("./package.json").version')
          plugin_archive="$GITHUB_WORKSPACE/.artifacts/benz-ai-x-dsh-client-ui-session-graph-$plugin_version.tgz"
          config_dump="$RUNNER_TEMP/dsh-session-graph-config.yml"
          pnpm --dir harness dsh plugin --profile web add "$plugin_archive"
          pnpm --dir harness dsh --profile web --dump-config > "$config_dump"
          rg --fixed-strings "name: '@benz-ai-x/dsh-client-ui-session-graph'" "$config_dump"
          pnpm --dir harness dsh plugin --profile web remove @benz-ai-x/dsh-client-ui-session-graph
          pnpm --dir harness dsh --profile web --dump-config > "$config_dump"
          if rg --fixed-strings "name: '@benz-ai-x/dsh-client-ui-session-graph'" "$config_dump"; then
            echo 'packed plugin remained in the resolved config after removal' >&2
            exit 1
          fi
          if rg --fixed-strings '@benz-ai-x/dsh-client-ui-session-graph' "$DSH_HOME/profiles/web/package.json"; then
            echo 'packed plugin remained in the profile after removal' >&2
            exit 1
          fi
